
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydoctor"
version = "0.1.0"
description = "A Python project diagnostics and repair assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Siddharth Pardeshi" }
]
keywords = [
    "python",
    "cli",
    "diagnostics",
    "developer-tools",
    "repair",
    "virtual-environment",
    "dependencies"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup"
]

dependencies = [
    "packaging>=24.0"
]

[project.urls]
Homepage = "https://github.com/Sapphire0507/pyDoctor"
Repository = "https://github.com/Sapphire0507/pyDoctor"
Issues = "https://github.com/Sapphire0507/pyDoctor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2"
]

[project.scripts]
pydoctor = "pydoctor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
